name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find project folder
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle is missing from the repo - please upload it"
            echo "Files found in repo:"; find . -not -path './.git*' | head -60
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Project found in: $(dirname "$f")"

      # The signing key lives in the repo's secrets, not in the code
      - name: Signing key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error title=No signing password::Add the ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/release.keystore; echo "Using the key from secrets"; fi
          test -s app/release.keystore || { echo "::error title=No signing key::Add the ANDROID_KEYSTORE_B64 secret"; exit 1; }

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle lintRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Report build errors
        if: failure()
        run: |
          # Surface the real error as one annotation so it can be read without opening the log.
          msg=$(grep -E ": Error: " build.log | head -30)
          [ -z "$msg" ] && msg=$(sed -n '/What went wrong/,/\* Try:/p' build.log | head -60)
          [ -z "$msg" ] && msg=$(grep -nE "error:|ERROR|Could not|FAILED" build.log | head -40)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/'%0D'}"
          echo "::error title=Build failed::$msg"

      - name: Rename APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" YMPlayerMobile.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: YM Player Mobile 1.0.${{ github.run_number }}
          files: YMPlayerMobile.apk
          body_path: app/src/main/assets/whats_new.txt
          make_latest: true

      # Test builds from the dev branch: a separate pre-release that never becomes "latest",
      # so the normal download link / Downloader code keeps giving the released version.
      - name: Publish test build
        if: github.ref == 'refs/heads/dev'
        run: cp YMPlayerMobile.apk YMPlayerMobile-test.apk

      - name: Upload test build
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Test build (dev branch)
          body: "Latest test build from the dev branch (run ${{ github.run_number }}). Not a release."
          files: YMPlayerMobile-test.apk
          prerelease: true
          make_latest: false
